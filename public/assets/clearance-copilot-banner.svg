<svg viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12131A"/>
      <stop offset="100%" stop-color="#1C1E2B"/>
    </linearGradient>
    <radialGradient id="sweepGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E3A23C" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#E3A23C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sweepArm" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E3A23C" stop-opacity="0"/>
      <stop offset="100%" stop-color="#E3A23C" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="320" fill="url(#bg)"/>

  <!-- Radar / clearance-scan motif, right side -->
  <g transform="translate(930,150)">
    <circle cx="0" cy="0" r="130" fill="url(#sweepGlow)"/>
    <circle cx="0" cy="0" r="120" fill="none" stroke="#3A3D52" stroke-width="1"/>
    <circle cx="0" cy="0" r="85" fill="none" stroke="#3A3D52" stroke-width="1"/>
    <circle cx="0" cy="0" r="50" fill="none" stroke="#3A3D52" stroke-width="1"/>
    <line x1="-120" y1="0" x2="120" y2="0" stroke="#2C2E3D" stroke-width="1"/>
    <line x1="0" y1="-120" x2="0" y2="120" stroke="#2C2E3D" stroke-width="1"/>

    <!-- sweep arm -->
    <g transform="rotate(-35)">
      <path d="M 0 0 L 120 0 A 120 120 0 0 0 98 -68 Z" fill="url(#sweepArm)" opacity="0.55"/>
      <line x1="0" y1="0" x2="120" y2="0" stroke="#E3A23C" stroke-width="2"/>
    </g>

    <!-- evidence nodes, source-validated claims -->
    <circle cx="72" cy="-52" r="5" fill="#4FADA0"/>
    <circle cx="-58" cy="70" r="5" fill="#4FADA0"/>
    <circle cx="-90" cy="-30" r="4" fill="#8B8D9B"/>
    <circle cx="40" cy="95" r="4" fill="#E3A23C"/>
    <circle cx="0" cy="0" r="6" fill="#F2F0E9"/>
  </g>

  <!-- Title block, left side -->
  <g transform="translate(70,0)">
    <text x="0" y="120" font-family="Georgia, 'Times New Roman', serif" font-size="56" fill="#F2F0E9">Clearance Copilot</text>
    <text x="0" y="160" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-style="italic" fill="#8B8D9B">Trace every claim before cameras roll.</text>

    <!-- flow row: extraction -> evidence -> verdict -->
    <g transform="translate(0,205)" font-family="'Helvetica Neue', Arial, sans-serif">
      <circle cx="6" cy="0" r="4" fill="#8B8D9B"/>
      <text x="20" y="5" font-size="15" fill="#C7C8D3">Screenplay claim</text>

      <line x1="150" y1="0" x2="200" y2="0" stroke="#3A3D52" stroke-width="1"/>

      <circle cx="216" cy="0" r="4" fill="#4FADA0"/>
      <text x="230" y="5" font-size="15" fill="#C7C8D3">Live evidence</text>

      <line x1="345" y1="0" x2="395" y2="0" stroke="#3A3D52" stroke-width="1"/>

      <circle cx="411" cy="0" r="4" fill="#E3A23C"/>
      <text x="425" y="5" font-size="15" fill="#C7C8D3">Prioritized verdict</text>
    </g>

    <!-- technology row -->
    <g transform="translate(0,255)" font-family="'Helvetica Neue', Arial, sans-serif">
      <text x="0" y="0" font-size="16" fill="#F2F0E9">Gemini 3.8 Flash</text>
      <text x="0" y="20" font-size="12" fill="#6F7180">evidence-grounded reasoning</text>

      <line x1="200" y1="-14" x2="200" y2="24" stroke="#2C2E3D" stroke-width="1"/>

      <text x="222" y="0" font-size="16" fill="#F2F0E9">Parallel Search</text>
      <text x="222" y="20" font-size="12" fill="#6F7180">live public-web retrieval</text>

      <line x1="422" y1="-14" x2="422" y2="24" stroke="#2C2E3D" stroke-width="1"/>

      <text x="444" y="0" font-size="16" fill="#F2F0E9">Google Cloud Agent Platform</text>
      <text x="444" y="20" font-size="12" fill="#6F7180">orchestration and tool dispatch</text>
    </g>
  </g>
</svg>
